name: Deploy site

# Publishes only the page and its data to GitHub Pages (not the scripts, README or notes).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check the data files load
        run: node -e "global.window={};require('./data.js');require('./benchmarks.js');if(!window.GLF_DATA.totals.users)process.exit(1)"
      - name: Collect the site
        run: |
          mkdir _site
          cp index.html data.js benchmarks.js _site/
          cp -r assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
